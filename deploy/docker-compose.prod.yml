# Production deployment for the Takween app on the Coolify VPS.
# Deploys as a standalone stack next to (but NOT managed by) Coolify:
#   - joins the "coolify" network so Coolify's Traefik proxy can route
#     wazzankw.com to this app
#   - owns its own Postgres + upload volume, isolated from all other apps
#
# Usage (on the server, inside deploy/):
#   docker compose -f docker-compose.prod.yml up -d --build
name: takween

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      network: host
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://wazzankw.com}
    container_name: takween-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      UPLOAD_DIR: /app/data
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://wazzankw.com}
      # next-auth v5: explicit canonical URL so post-login redirects use the domain
      AUTH_URL: ${AUTH_URL:-https://wazzankw.com}
      AUTH_TRUST_HOST: "true"
      # Apply migrations before starting the updated app:
      # docker compose -f docker-compose.prod.yml run --rm app node node_modules/prisma/build/index.js migrate deploy
      RUN_MIGRATIONS: "false"
      SEED_ON_START: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - takween_uploads:/app/data
    networks:
      - takween
      - coolify
    labels:
      - traefik.enable=true
      # App sits on two networks; pin the one Traefik shares with it.
      - traefik.docker.network=coolify
      # HTTP -> HTTPS redirect
      - traefik.http.routers.takween-http.rule=Host(`wazzankw.com`) || Host(`www.wazzankw.com`)
      - traefik.http.routers.takween-http.entrypoints=http
      - traefik.http.routers.takween-http.middlewares=takween-redirect
      - traefik.http.middlewares.takween-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.takween-redirect.redirectscheme.permanent=true
      # HTTPS router
      - traefik.http.routers.takween.rule=Host(`wazzankw.com`) || Host(`www.wazzankw.com`)
      - traefik.http.routers.takween.entrypoints=https
      - traefik.http.routers.takween.tls=true
      - traefik.http.routers.takween.tls.certresolver=letsencrypt
      - traefik.http.services.takween.loadbalancer.server.port=3000

  db:
    image: postgres:16-alpine
    container_name: takween-db
    restart: unless-stopped
    # localhost-only publish so Docker builds can reach the DB during prerender
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: takween
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: takween
    volumes:
      - takween_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takween"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - takween

volumes:
  takween_uploads:
  takween_pgdata:

networks:
  takween:
    driver: bridge
  coolify:
    external: true
